<svg xmlns="http://www.w3.org/2000/svg">
<g id="s5av2" transform="translate(16480,10971)" data-frame="Step 5a · Technical feasibility">
<rect data-type="frame" x="0" y="0" width="3960" height="1640" fill="#ffffff" data-title="Step 5a · Technical feasibility" />
<rect id="s5av2-r1" x="64" y="64" width="396" height="48" fill="#c6dcff" stroke="none" rx="24" data-content="&lt;b&gt;STEP 5 · CAN WE MAKE IT?&lt;/b&gt;" data-font-family="noto_sans" data-font-size="22" data-text-color="#305bab" />
<textArea id="s5av2-t2" x="64" y="132" width="3832" height="94" font-family="noto_sans" font-size="67" fill="#1a1a1a" font-weight="bold"><b>5.1 Technical feasibility</b></textArea>
<textArea id="s5av2-t3" x="64" y="258" width="3832" height="31" font-family="noto_sans" font-size="22" fill="#1a1a1a"><b>Built and live (checked Oct 6, 2026, synthetic data only [S28]):</b></textArea>
<rect id="s5av2-r4" x="64" y="309" width="3832" height="64" fill="#c6dcff" stroke="none" />
<textArea id="s5av2-t5" x="78" y="327.0" width="2182" height="28" font-family="noto_sans" font-size="20" fill="#1a1a1a" font-weight="bold"><b>Capability</b></textArea>
<textArea id="s5av2-t6" x="2288" y="327.0" width="1594" height="28" font-family="noto_sans" font-size="20" fill="#1a1a1a" font-weight="bold"><b>Status</b></textArea>
<textArea id="s5av2-t7" x="78" y="391.0" width="2182" height="28" font-family="noto_sans" font-size="20" fill="#1a1a1a"><b>Three-generation tree, side of family fixed by layout, guided cardiac questions</b></textArea>
<textArea id="s5av2-t8" x="2288" y="391.0" width="1594" height="28" font-family="noto_sans" font-size="20" fill="#595959">Built</textArea>
<textArea id="s5av2-t9" x="78" y="455.0" width="2182" height="28" font-family="noto_sans" font-size="20" fill="#1a1a1a"><b>Statuses derived from reports (known / conflicting / unknown / declined); each fact keeps who said it and when</b></textArea>
<textArea id="s5av2-t10" x="2288" y="455.0" width="1594" height="28" font-family="noto_sans" font-size="20" fill="#595959">Built; 10 of 10 logic tests pass</textArea>
<textArea id="s5av2-t11" x="78" y="519.0" width="2182" height="28" font-family="noto_sans" font-size="20" fill="#1a1a1a"><b>Relative invite and reply by link, no account; replies accepted only from invited relatives</b></textArea>
<textArea id="s5av2-t12" x="2288" y="519.0" width="1594" height="28" font-family="noto_sans" font-size="20" fill="#595959">Built (today the relative's answers come back as a reply link the relative texts to the patient; nothing is stored on our servers)</textArea>
<textArea id="s5av2-t13" x="78" y="583.0" width="2182" height="56" font-family="noto_sans" font-size="20" fill="#1a1a1a"><b>"Connect MyChart": real SMART on FHIR standalone launch (OAuth 2 + PKCE), read-only Patient and Condition scopes, against the public SMART Health IT sandbox; relative ticks one condition, labeled "on problem list since &amp;lt;year&amp;gt;"</b></textArea>
<textArea id="s5av2-t14" x="2288" y="597.0" width="1594" height="28" font-family="noto_sans" font-size="20" fill="#595959">Built (sandbox) [18]</textArea>
<textArea id="s5av2-t15" x="78" y="710.0" width="2182" height="28" font-family="noto_sans" font-size="20" fill="#1a1a1a"><b>Patient view with no alerts; care-team document with guideline criteria, "also noted" and "to clarify" tiers, each citing guideline and year</b></textArea>
<textArea id="s5av2-t16" x="2288" y="675.0" width="1594" height="98" font-family="noto_sans" font-size="20" fill="#595959">Built. The two fixes from open item 8 are live (Oct 7, 2026): Print gives the patient's own copy and the patient never sees the care-team copy, and a second-degree relative's reported high cholesterol is labeled with Simon Broome criteria (Dutch Lipid Clinic counts first-degree relatives only)</textArea>
<textArea id="s5av2-t17" x="78" y="809.0" width="2182" height="28" font-family="noto_sans" font-size="20" fill="#1a1a1a"><b>Print/PDF, read-only link and QR; FHIR R4 FamilyMemberHistory export</b></textArea>
<textArea id="s5av2-t18" x="2288" y="809.0" width="1594" height="28" font-family="noto_sans" font-size="20" fill="#595959">Built (export not yet run through the HL7 validator)</textArea>
<line id="s5av2-d19" data-type="divider" x1="64" y1="855" x2="3896" y2="855" stroke="#b0b0b0" stroke-width="2" />
<textArea id="s5av2-t20" x="64" y="887" width="3832" height="31" font-family="noto_sans" font-size="22" fill="#1a1a1a"><b>What's hard, and the workaround:</b></textArea>
<rect id="s5av2-r21" x="64" y="938" width="3832" height="64" fill="#c6dcff" stroke="none" />
<textArea id="s5av2-t22" x="78" y="956.0" width="148" height="28" font-family="noto_sans" font-size="20" fill="#1a1a1a" font-weight="bold"><b>No.</b></textArea>
<textArea id="s5av2-t23" x="254" y="956.0" width="1151" height="28" font-family="noto_sans" font-size="20" fill="#1a1a1a" font-weight="bold"><b>Hard or unknown</b></textArea>
<textArea id="s5av2-t24" x="1433" y="956.0" width="1033" height="28" font-family="noto_sans" font-size="20" fill="#1a1a1a" font-weight="bold"><b>Why</b></textArea>
<textArea id="s5av2-t25" x="2494" y="956.0" width="1388" height="28" font-family="noto_sans" font-size="20" fill="#1a1a1a" font-weight="bold"><b>Workaround or test</b></textArea>
<textArea id="s5av2-t26" x="78" y="1020.0" width="148" height="28" font-family="noto_sans" font-size="20" fill="#1a1a1a"><b>1</b></textArea>
<textArea id="s5av2-t27" x="254" y="1020.0" width="1151" height="28" font-family="noto_sans" font-size="20" fill="#595959">Pilot backend not built (server storage, magic-link login, staff MFA, expiring invite tokens, audit log)</textArea>
<textArea id="s5av2-t28" x="1433" y="1020.0" width="1033" height="28" font-family="noto_sans" font-size="20" fill="#595959">Prototype is serverless by design</textArea>
<textArea id="s5av2-t29" x="2494" y="1020.0" width="1388" height="28" font-family="noto_sans" font-size="20" fill="#595959">Build on synthetic data on free tiers; switch to the BAA stack only when a pilot is signed (mvp-spec §11–12)</textArea>
<textArea id="s5av2-t30" x="78" y="1084.0" width="148" height="28" font-family="noto_sans" font-size="20" fill="#1a1a1a"><b>2</b></textArea>
<textArea id="s5av2-t31" x="254" y="1084.0" width="1151" height="28" font-family="noto_sans" font-size="20" fill="#595959">Portals don't have to share family history</textArea>
<textArea id="s5av2-t32" x="1433" y="1084.0" width="1033" height="28" font-family="noto_sans" font-size="20" fill="#595959">FamilyMemberHistory is not in USCDI; requesting it ends Epic auto-distribution [7][10][2]</textArea>
<textArea id="s5av2-t33" x="2494" y="1084.0" width="1388" height="28" font-family="noto_sans" font-size="20" fill="#595959">Relatives answer for themselves; the portal step only upgrades one problem-list fact [5]</textArea>
<textArea id="s5av2-t34" x="78" y="1148.0" width="148" height="28" font-family="noto_sans" font-size="20" fill="#1a1a1a"><b>3</b></textArea>
<textArea id="s5av2-t35" x="254" y="1148.0" width="1151" height="28" font-family="noto_sans" font-size="20" fill="#595959">No write-back into Epic family history</textArea>
<textArea id="s5av2-t36" x="1433" y="1148.0" width="1033" height="28" font-family="noto_sans" font-size="20" fill="#595959">Epic has no create API for FamilyMemberHistory [10]</textArea>
<textArea id="s5av2-t37" x="2494" y="1148.0" width="1388" height="28" font-family="noto_sans" font-size="20" fill="#595959">PDF first; fax from a BAA backend; SMART Health Link in the pilot [27][29]</textArea>
<textArea id="s5av2-t38" x="78" y="1212.0" width="148" height="28" font-family="noto_sans" font-size="20" fill="#1a1a1a"><b>4</b></textArea>
<textArea id="s5av2-t39" x="254" y="1212.0" width="1151" height="28" font-family="noto_sans" font-size="20" fill="#595959">Where the page lands in each practice's EHR</textArea>
<textArea id="s5av2-t40" x="1433" y="1212.0" width="1033" height="28" font-family="noto_sans" font-size="20" fill="#595959">Independent practices run different EHRs</textArea>
<textArea id="s5av2-t41" x="2494" y="1212.0" width="1388" height="28" font-family="noto_sans" font-size="20" fill="#595959">Ask on every call; test a PDF upload at one practice (target &amp;lt; 2 min staff time)</textArea>
<textArea id="s5av2-t42" x="78" y="1276.0" width="148" height="28" font-family="noto_sans" font-size="20" fill="#1a1a1a"><b>5</b></textArea>
<textArea id="s5av2-t43" x="254" y="1276.0" width="1151" height="28" font-family="noto_sans" font-size="20" fill="#595959">Older relatives on phones</textArea>
<textArea id="s5av2-t44" x="1433" y="1276.0" width="1033" height="28" font-family="noto_sans" font-size="20" fill="#595959">MeTree: 26% needed help, 77% of them over 60 [90]</textArea>
<textArea id="s5av2-t45" x="2494" y="1276.0" width="1388" height="28" font-family="noto_sans" font-size="20" fill="#595959">Usability sessions with adults over 60; a help line</textArea>
<textArea id="s5av2-t46" x="78" y="1340.0" width="148" height="28" font-family="noto_sans" font-size="20" fill="#1a1a1a"><b>6</b></textArea>
<textArea id="s5av2-t47" x="254" y="1340.0" width="1151" height="28" font-family="noto_sans" font-size="20" fill="#595959">Clinical rules must be right</textArea>
<textArea id="s5av2-t48" x="1433" y="1340.0" width="1033" height="28" font-family="noto_sans" font-size="20" fill="#595959">Two cutoffs still unverified [research §3.1]</textArea>
<textArea id="s5av2-t49" x="2494" y="1340.0" width="1388" height="28" font-family="noto_sans" font-size="20" fill="#595959">Rules cite verified text only; a cardiologist signs the rule table before any pilot</textArea>
<line id="s5av2-d50" data-type="divider" x1="64" y1="1386" x2="3896" y2="1386" stroke="#b0b0b0" stroke-width="2" />
<rect id="s5av2-p51" x="64" y="1418" width="3832" height="110" fill="#fff6b6" stroke="none" rx="12" />
<textArea id="s5av2-t52" x="96" y="1450" width="3768" height="46" font-family="noto_sans" font-size="33" fill="#1a1a1a"><b>Technical verdict: Yes.</b> Nothing on the list needs new technology. Next build: the pilot backend (row 1), still on synthetic data, before any real patient.</textArea>
</g>
</svg>